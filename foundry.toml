# BeTrueCore — Foundry configuration
# Part of BeTrueCore Developer Package v0.3
# github.com/Dede-Qorqud/BeTrueCore
#
# Running the test suite needs the Forge standard library in lib/forge-std:
#     forge install foundry-rs/forge-std
# Remappings are left to Foundry's own detection of lib/, so the paths stay
# correct however that library is vendored. Note that circuits/lib/ is a
# different thing entirely — it holds Circom sources and Foundry never reads it.

[profile.default]
src            = "src"
test           = "test"
out            = "out"
libs           = ["lib"]
solc_version   = "0.8.24"
evm_version    = "shanghai"
optimizer      = true
optimizer_runs = 200
ffi            = false

# contracts/ is a source root only under the profile below. Files there are
# still compiled by the default profile whenever src/ or test/ imports them
# by relative path, and test/ does: VerifierRegistry.t.sol imports
# Verifier.sol and NINNullifierRegistry.sol, BeTrueCore.t.sol,
# Assertions.t.sol and RegistrationProof.t.sol import RegistrationVerifier.sol,
# and CompositionTree.t.sol imports CompositionTree.sol.
# The consequence worth knowing before adding a file here: one that no test
# imports is never compiled by `forge test`, so it can be broken while the
# Assertions check still passes. Build the directory as a root with:
#     FOUNDRY_PROFILE=contracts forge build
[profile.contracts]
src            = "contracts"
out            = "out-contracts"
libs           = ["lib"]
solc_version   = "0.8.24"
evm_version    = "shanghai"
optimizer      = true
optimizer_runs = 200
