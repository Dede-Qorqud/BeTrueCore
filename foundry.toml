# BeTrueCore — Foundry configuration
# Part of BeTrueCore Developer Package v0.3
# github.com/Dede-Qorqud/BeTrueCore
#
# Running the test suite needs the Forge standard library in lib/forge-std:
#     forge install foundry-rs/forge-std
# Remappings are left to Foundry's own detection of lib/, so the paths stay
# correct however that library is vendored. Note that circuits/lib/ is a
# different thing entirely — it holds Circom sources and Foundry never reads it.

[profile.default]
src            = "src"
test           = "test"
out            = "out"
libs           = ["lib"]
solc_version   = "0.8.24"
evm_version    = "shanghai"
optimizer      = true
optimizer_runs = 200
ffi            = false

# The L1 registry lives outside src/ and nothing under src/ or test/ imports
# it, so the default profile never reaches it. Build it with:
#     FOUNDRY_PROFILE=contracts forge build
[profile.contracts]
src            = "contracts"
out            = "out-contracts"
libs           = ["lib"]
solc_version   = "0.8.24"
evm_version    = "shanghai"
optimizer      = true
optimizer_runs = 200